<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Working Deep — an interactive laboratory</title>
<meta name="description" content="Eight principles for deep work, as things you can manipulate: a system map, eight experiments, and three working tools.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f1e7">
<link rel="stylesheet" href="css/main.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f6f1e7'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%234a32b4' stroke-width='2'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='%234a32b4' stroke-width='1'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="#explore" aria-label="Working Deep — go to the system map">
      <svg class="brand__mark" viewBox="0 0 22 22" aria-hidden="true">
        <circle cx="11" cy="11" r="9.2" fill="none" stroke="currentColor" stroke-width="1.1"/>
        <circle cx="11" cy="4.4" r="1.8" fill="currentColor"/>
        <circle cx="17.7" cy="14.6" r="1.8" fill="currentColor"/>
        <circle cx="4.3" cy="14.6" r="1.8" fill="currentColor"/>
        <path d="M11 6.2v3.4M16.3 13.6 12.5 12M5.7 13.6 9.5 12" stroke="currentColor" stroke-width="1.1" fill="none"/>
      </svg>
      <span class="brand__name">Working Deep</span>
      <span class="brand__sub" id="brandSub">system map</span>
    </a>
    <div class="topbar__tools">
      <button class="tool" id="dataBtn" type="button" aria-haspopup="dialog">Data</button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Experiences">
    <a class="tab" href="#explore" data-nav="explore">
      <span class="tab__n">01</span><span class="tab__l">Explore</span>
    </a>
    <a class="tab" href="#sim/01" data-nav="sim">
      <span class="tab__n">02</span><span class="tab__l">Simulate</span>
    </a>
    <a class="tab" href="#bench/a" data-nav="bench">
      <span class="tab__n">03</span><span class="tab__l">Workbench</span>
    </a>
    <a class="tab" href="#progress" data-nav="progress">
      <span class="tab__n">04</span><span class="tab__l">Progress</span>
    </a>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet__grab" aria-hidden="true"></div>
  <header class="sheet__head">
    <h2 class="sheet__title" id="sheetTitle">Detail</h2>
    <button class="sheet__close" id="sheetClose" type="button" aria-label="Close">✕</button>
  </header>
  <div class="sheet__body" id="sheetBody"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
